; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L

; UART0 is shared with the Nextion display, so the monitor must match its baud
; rate. This is the BMS project's 9600, not the LED project's 115200.
monitor_speed = 9600

build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D NIMBLE_DEBUG=0
	; Debug logging sink: 0 = off (keeps the Nextion UART clean),
	; 1 = Serial/UART0 (default, shared with the display),
	; 2 = Serial1 on a separate debug UART. See include/logging.hpp.
	-D ROVER_DEBUG=1
	; Set to 1 to claim a static IP instead of using DHCP. See include/config.hpp.
	-D ROVER_WIFI_USE_STATIC_IP=0
	; Number of LEDs on the strip. See include/config.hpp.
	-D ROVER_NUM_LEDS=40
	; Boot-time strip diagnostic: 0 = off, 1 = chase then dim fill before normal
	; operation (tells a data-path fault from a power fault), 2 = repeat one frame
	; forever for a scope to trigger on, never reaching loop(). See
	; LedController::run_self_test() and the troubleshooting section of README.md.
	-D ROVER_LED_SELFTEST=0
	; ROVER_LED_CHIPSET / ROVER_LED_COLOR_ORDER / ROVER_LED_CLOCKLESS (strip type),
	; ROVER_LED_SPI_MHZ (signal) and ROVER_LED_BRIGHTNESS / ROVER_LED_MAX_MILLIAMPS
	; (power) are left at the defaults in include/led_controller.hpp and
	; include/config.hpp. Override them here while diagnosing a strip that lights
	; only part way.

lib_deps = 
	h2zero/NimBLE-Arduino@^1.4.3
	seithan/Easy Nextion Library@^1.0.6
	fastled/FastLED@^3.9.0

lib_compat_mode = strict

; Host build for the Daly protocol decoder, which is pure byte-shuffling with no
; hardware dependency. Compiles daly_100_bms.cpp only, against the stub Arduino.h
; in test/native_stubs. AddressSanitizer is on because the decoder indexes into
; fixed-size frame payloads and a bounds slip should fail the build, not the pack.
;
; Requires a host GCC on PATH. On a machine without one (Windows + MSVC only),
; use tools/run_native_tests.ps1, which builds the same sources with cl.exe.
;
;   pio test -e native
; [env:native]
; platform = native
; test_framework = custom
; build_type = debug
; build_flags =
; 	-std=gnu++17
; 	-Wall
; 	-Wextra
; 	-D ROVER_DEBUG=0
; 	-I include
; 	-I test/native_stubs
; 	-fsanitize=address
; 	-g
; build_src_filter = +<daly_100_bms.cpp> +<bms_telemetry_codec.cpp>
